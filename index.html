<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>新桥猫IP联名设计｜四段宣传动画</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:"Microsoft Yahei",sans-serif;}
        body{background-color:#f4f8fa;color:#223344;line-height:1.7;}
        header{background:linear-gradient(135deg,#b8ccd9,#6e9cb8);color:#fff;padding:32px 20px;text-align:center;}
        header h1{font-size:32px;margin-bottom:8px;}
        header p{opacity:0.9;font-size:16px;}
        .container{max-width:1000px;margin:0 auto;padding:40px 20px;}
        .video-item{background:#fff;border-radius:16px;padding:24px;box-shadow:0 3px 12px #0000000a;margin-bottom:30px;text-align:center;}
        .video-item h2{color:#306e91;font-size:20px;margin-bottom:14px;}
        video{width:100%;max-width:800px;border-radius:12px;box-shadow:0 4px 16px #00000018;}
        .desc{margin-top:10px;color:#555;}
        footer{text-align:center;padding:24px;background:#e8f1f7;color:#446677;font-size:14px;margin-top:20px;}
    </style>
</head>
<body>
<header>
    <h1>新桥猫 IP 联名设计</h1>
    <p>「融·合」主题创意设计实践｜四段动画短片（每段15s）</p>
</header>
<div class="container">
    <!-- 第一段 0-15s 登场 -->
    <div class="video-item">
        <h2>第一段｜0-15s 新桥猫登场</h2>
        <video controls>
            <source src="video1.mp4" type="video/mp4">
            浏览器不支持视频播放
        </video>
        <p class="desc">河畔石桥场景，新桥猫蹦跳出场，展示完整IP形象</p>
    </div>

    <!-- 第二段 15-30s 三视图&色卡 -->
    <div class="video-item">
        <h2>第二段｜15-30s 角色设定展示</h2>
        <video controls>
            <source src="video2.mp4" type="video/mp4">
            浏览器不支持视频播放
        </video>
        <p class="desc">新桥猫转动展示三视图，桥纹纹样、色彩规范动态呈现</p>
    </div>

    <!-- 第三段 30-45s 表情社交 -->
    <div class="video-item">
        <h2>第三段｜30-45s IP表情延展</h2>
        <video controls>
            <source src="video3.mp4" type="video/mp4">
            浏览器不支持视频播放
        </video>
        <p class="desc">聊天界面内切换多种情绪表情，展示线上社交传播效果</p>
    </div>

    <!-- 第四段 45-60s 周边衍生品 -->
    <div class="video-item">
        <h2>第四段｜45-60s 联名文创落地</h2>
        <video controls>
            <source src="video4.mp4" type="video/mp4">
            浏览器不支持视频播放
        </video>
        <p class="desc">IP形象印制到帆布包、徽章、钥匙扣、贴纸，收尾定格主视觉</p>
    </div>
</div>
<footer>
新桥猫IP联名设计｜融·合主题创意设计实践
</footer>
</body>
</html>
